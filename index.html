<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Studio Code Route · Quartier résidentiel V2</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#b9d9e9}#scene{position:fixed;inset:0}canvas{display:block}#top{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.pill{background:#172e41e8;color:white;padding:10px 15px;border-radius:15px;box-shadow:0 5px 20px #20313b30}.pill strong{font-size:15px}.pill small{display:block;color:#b9d6e3;font-size:11px;margin-top:3px}#bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 15px);left:12px;right:12px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button{border:0;border-radius:14px;background:#fff;color:#183142;padding:13px 17px;font-size:14px;font-weight:750;box-shadow:0 5px 18px #102e4035}button.primary{background:#1d7894;color:white}#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 81px);width:100%;text-align:center;color:#fff;text-shadow:0 2px 6px #152f3e;font-size:12px;pointer-events:none}#error{display:none;position:absolute;inset:20%;background:white;color:#234;padding:20px;border-radius:16px;z-index:10}#badge{background:#ffffffdf;color:#284658;padding:9px 12px;border-radius:12px;font-size:12px;font-weight:800}</style></head><body><div id="scene"></div><div id="top"><div class="pill"><strong>01 · Quartier résidentiel</strong><small>Studio Code Route · Version 2.1</small></div><div id="badge">Priorité à droite</div></div><div id="hint">Glisser pour tourner · Pincer pour zoomer</div><div id="bottom"><button class="primary" id="play">▶ Lancer</button><button id="reset">↺ Rejouer</button><button id="camera">◉ Vue initiale</button></div><div id="error"></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script>window.addEventListener("error",e=>{const x=document.getElementById("error");x.style.display="block";x.textContent="Erreur 3D : "+e.message});window.addEventListener("unhandledrejection",e=>{const x=document.getElementById("error");x.style.display="block";x.textContent="Erreur de chargement : "+(e.reason?.message||e.reason)});</script><script type="module">
import * as T from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const el=document.querySelector('#scene');const scene=new T.Scene();scene.background=new T.Color(0xb9d9ed);scene.fog=new T.Fog(0xb9d9ed,75,150);
const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.55;el.appendChild(renderer.domElement);
const camera=new T.PerspectiveCamera(36,innerWidth/innerHeight,.1,200);const portrait=innerHeight>innerWidth;const initial=portrait?[30,33,39]:[26,27,32];camera.position.set(...initial);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.maxPolarAngle=1.38;controls.minDistance=17;controls.maxDistance=76;controls.update();
scene.add(new T.HemisphereLight(0xeaf7ff,0x6c8c57,2.0));const sun=new T.DirectionalLight(0xffefcf,3.2);sun.position.set(-25,43,22);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-43;sun.shadow.camera.right=43;sun.shadow.camera.top=43;sun.shadow.camera.bottom=-43;sun.shadow.normalBias=.025;scene.add(sun);
const mat=(c,r=1,m=0)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m});const grass=mat('#83b65b'),lawn=mat('#96c66d'),road=mat('#555d63'),side=mat('#c9c8bd'),white=mat('#f7f5e8'),roofRed=mat('#bd6242'),wall=mat('#f6e3c0'),dark=mat('#304252'),windowMat=mat('#86b5c5',.22,.1),wood=mat('#ac7855');
function box(w,h,d,x,y,z,m,shadow=true){const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=shadow;o.receiveShadow=true;scene.add(o);return o}
function cyl(r1,r2,h,x,y,z,m,n=10){const o=new T.Mesh(new T.CylinderGeometry(r1,r2,h,n),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function sphere(r,x,y,z,m,sx=1,sy=1,sz=1){const o=new T.Mesh(new T.IcosahedronGeometry(r,1),m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;scene.add(o);return o}
function line(x1,z1,x2,z2,width=0.12){let a=new T.Vector3(x1,.074,z1),b=new T.Vector3(x2,.074,z2),dir=b.clone().sub(a),o=new T.Mesh(new T.BoxGeometry(width,.012,dir.length()),white);o.position.copy(a.add(b).multiplyScalar(.5));o.rotation.y=Math.atan2(dir.x,dir.z);scene.add(o)}
// Main streets and pavements: two roads crossing at the center.
box(100,.12,100,0,-.22,0,grass,false);box(100,.07,9.2,0,-.09,0,side,false);box(9.2,.07,100,0,-.085,0,side,false);box(100,.08,7.6,0,-.02,0,road,false);box(7.6,.08,100,0,-.015,0,road,false);
for(let i=-44;i<=44;i+=5.2){if(Math.abs(i)>5.5){box(2.5,.012,.13,i,.029,0,white,false);box(.13,.012,2.5,0,.029,i,white,false)}}
// Corner dashed yield markings.
for(let v=-3.1;v<=3.1;v+=1.05){box(.65,.018,.17,v,.04,5.2,white,false);box(.65,.018,.17,v,.04,-5.2,white,false);box(.17,.018,.65,5.2,.04,v,white,false);box(.17,.018,.65,-5.2,.04,v,white,false)}
// Separate pavement borders and front lawns.
for(let z of [-5.05,5.05])for(let x of [-15,15])box(18,.06,.23,x,.01,z,mat('#f1e7d2'),false);
for(let x of [-5.05,5.05])for(let z of [-15,15])box(.23,.06,18,x,.01,z,mat('#f1e7d2'),false);
function roof(x,z,w,d,h,color){const material=mat(color);const geom=new T.BufferGeometry();let p=[-w/2,0,-d/2, w/2,0,-d/2,0,h,-d/2, -w/2,0,d/2,w/2,0,d/2,0,h,d/2];const faces=[0,1,2,3,5,4,0,2,5,0,5,3,1,4,5,1,5,2,0,3,4,0,4,1];let pts=[];for(let i of faces)pts.push(p[i*3],p[i*3+1],p[i*3+2]);geom.setAttribute('position',new T.Float32BufferAttribute(pts,3));geom.computeVertexNormals();const mesh=new T.Mesh(geom,new T.MeshStandardMaterial({color,side:T.DoubleSide,roughness:.9}));mesh.position.set(x,3.5,z);mesh.castShadow=true;scene.add(mesh)}
function house(x,z,variant=0){const w=7.3,d=6.1,body=mat(['#f7e5c7','#ffe3bb','#e9d9c5','#f6eadb'][variant%4]);box(w,3.65,d,x,1.8,z,body);roof(x,z,w+.8,d+.8,2.0,['#b9583e','#bf6b47','#ad654f','#a9533d'][variant%4]);box(1.3,2,.11,x-1.5,1.05,z+d/2+.07,wood);for(let dx of [-2.2,1.9]){box(1.4,1.4,.12,x+dx,2.35,z+d/2+.08,mat('#f5f4eb'));box(1.1,1.12,.15,x+dx,2.35,z+d/2+.15,windowMat);box(.12,1.2,.18,x+dx,2.35,z+d/2+.25,mat('#f7f5ee'));box(1.38,.12,.22,x+dx,1.68,z+d/2+.2,mat('#f2efe5'))}box(.75,.9,.7,x+2.2,4.7,z,mat('#c2b3a0'));box(1.3,.12,1.1,x+2.2,5.2,z,roofRed);}
function hedge(x,z,length,axis='x'){for(let i=-length/2;i<=length/2;i+=.7){let xx=x+(axis==='x'?i:0),zz=z+(axis==='z'?i:0);sphere(.57,xx,.6,zz,mat(i%2?'#4e963e':'#559e45'),1.1,.85,.95)}}
function fence(x,z,length,axis='x'){for(let i=-length/2;i<=length/2+.01;i+=2){const xx=x+(axis==='x'?i:0),zz=z+(axis==='z'?i:0);box(.23,1.15,.23,xx,.54,zz,mat('#eee5d4'));sphere(.17,xx,1.19,zz,mat('#eee5d4'))}if(axis==='x')box(length,.09,.1,x,.75,z,mat('#f0e6d4'));else box(.1,.09,length,x,.75,z,mat('#f0e6d4'))}
function tree(x,z,s=1){const bark=mat('#836447');cyl(.23*s,.36*s,3*s,x,1.55*s,z,bark,8);for(let [dx,dy,dz,r] of [[0,3.5,0,1.55],[-.8,3.0,.3,1.12],[.85,3.25,-.4,1.2],[.2,4.25,.3,1.1]])sphere(r*s,x+dx*s,dy*s,z+dz*s,mat(['#4b9c43','#5da94b','#70b54f'][Math.abs(Math.floor((x+z+dx)*3))%3]),1,1.05,1)}
function flowerBed(x,z){sphere(.7,x,.19,z,mat('#4f9c43'),1.5,.38,1);for(let j=0;j<10;j++){let a=j*2.4; sphere(.1,x+Math.cos(a)*.58,.37,z+Math.sin(a)*.43,mat(['#ffb3d1','#ffef88','#fff6e8','#ed83a8'][j%4]))}}
// Place houses well away from the road, surrounded by vegetation.
for(let [x,z,v] of [[-14,-14,0],[14,-14,1],[-14,14,2],[14,14,3],[-32,-14,1],[32,14,0],[-14,-32,3],[14,32,2]]){house(x,z,v);hedge(x,z>0?7.1:-7.1,8.5);fence(x,z>0?8.2:-8.2,10);flowerBed(x-4.6,z>0?7.7:-7.7)}
for(let [x,z,s] of [[-23,-8,1.25],[-8,-22,1.05],[23,9,1.15],[8,23,1.2],[-23,22,1.3],[23,-23,1.1],[-35,8,1.2],[35,-8,1.25],[-9,9,.8],[9,-9,.8]])tree(x,z,s);
for(let [x,z] of [[-7,7],[7,7],[-7,-7],[7,-7],[-19,7],[19,-7]])flowerBed(x,z);
// Low curb-side bollards and a few lamps.
function bollard(x,z){cyl(.12,.13,.85,x,.44,z,mat('#444b4b'),8);sphere(.13,x,.91,z,mat('#ddd6b9'))}for(let x of [-9,-7,7,9])for(let z of [-5.1,5.1])bollard(x,z);
function car(color){let group=new T.Group();let body=mat(color,.35,.12),glass=mat('#85b2c2',.17,.18),rubber=mat('#22292d'),chrome=mat('#e5e8e7',.24,.35);function b(w,h,d,x,y,z,m){let o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;group.add(o)}b(1.92,.55,3.75,0,.78,0,body);b(1.7,.62,2.05,0,1.32,-.18,body);b(1.55,.42,.06,0,1.37,.89,glass);b(1.55,.42,.06,0,1.37,-1.23,glass);for(let side of [-1,1]){b(.07,.36,1.68,side*.86,1.36,-.18,glass);for(let zz of [-1.13,1.13]){const tire=new T.Mesh(new T.CylinderGeometry(.37,.37,.21,16),rubber);tire.rotation.z=Math.PI/2;tire.position.set(side*1.01,.44,zz);tire.castShadow=true;group.add(tire);const hub=new T.Mesh(new T.CylinderGeometry(.2,.2,.225,12),chrome);hub.rotation.z=Math.PI/2;hub.position.set(side*1.01,.44,zz);group.add(hub)}}for(let side of [-.65,.65]){b(.37,.19,.07,side,.84,1.9,mat('#fff9df',.18));b(.4,.18,.07,side,.83,-1.9,mat('#c73e37'))}b(1.2,.12,.06,0,.53,1.91,mat('#303b3d'));b(1.2,.12,.06,0,.53,-1.91,mat('#303b3d'));return group}
const blue=car('#287cc0'),red=car('#cb4445');scene.add(blue,red);let playing=false,start=0,elapsed=0;const duration=10;
function pose(t){ // Blue approaches from the south, red from the east. Blue yields to red.
const bz=t<2.6?15-t*3.3:t<5.3?6.42:t<8.6?6.42-(t-5.3)*4.1:-7.2-(t-8.6)*3;
blue.position.set(-1.85,.05,bz);blue.rotation.y=Math.PI;
const rx=t<1.7?16-t*4:t<6.1?9.2-(t-1.7)*4.2:-9.28-(t-6.1)*4;
red.position.set(rx,.05,-1.85);red.rotation.y=-Math.PI/2;
}pose(0);
function tick(now){requestAnimationFrame(tick);if(playing){elapsed=Math.min(duration,(now-start)/1000);pose(elapsed);if(elapsed>=duration){playing=false;document.querySelector('#play').textContent='▶ Relancer'}}controls.update();renderer.render(scene,camera)}requestAnimationFrame(tick);
document.querySelector('#play').onclick=()=>{if(elapsed>=duration)elapsed=0;if(playing){playing=false;document.querySelector('#play').textContent='▶ Continuer'}else{start=performance.now()-elapsed*1000;playing=true;document.querySelector('#play').textContent='⏸ Pause'}};
document.querySelector('#reset').onclick=()=>{playing=false;elapsed=0;pose(0);document.querySelector('#play').textContent='▶ Lancer'};
document.querySelector('#camera').onclick=()=>{camera.position.set(...initial);controls.target.set(0,0,0);controls.update()};
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
