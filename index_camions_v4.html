<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Studio Code de la route — Camions V4</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#93c9f1;font-family:system-ui,-apple-system,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:10;display:flex;align-items:center;gap:9px;padding:11px;border-radius:16px;background:rgba(13,26,39,.86);color:white;box-shadow:0 5px 20px #0004}button{border:0;background:#f6d35c;color:#172434;font-weight:800;font-size:15px;padding:12px 18px;border-radius:11px;min-width:104px}button:active{transform:scale(.98)}#time{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}#progress{flex:1;min-width:30px;accent-color:#f6d35c}#title{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;text-align:center;color:white;text-shadow:0 2px 8px #000b;font-weight:800;font-size:14px;pointer-events:none}#status{position:fixed;top:calc(36px + env(safe-area-inset-top));left:12px;right:12px;text-align:center;color:#fff;text-shadow:0 2px 7px #000a;font-size:12px;font-weight:650;pointer-events:none}#error{position:fixed;top:28%;left:10%;width:80%;color:white;background:#a32323;padding:16px;border-radius:12px;display:none;z-index:20}#hint{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#fff;text-shadow:0 2px 5px #000b;font-size:12px;pointer-events:none}</style></head><body>
<div id="title">STUDIO CODE DE LA ROUTE · CAMIONS V4</div><div id="status">Prêt — vue aérienne de poursuite</div><div id="hint">Prototype 3D · 50 secondes · caméra automatique</div><div id="error"></div><div id="hud"><button id="play">▶ Lancer</button><input id="progress" type="range" min="0" max="50" step="0.05" value="0" aria-label="Avancer dans l'animation"><span id="time">00:00 / 00:50</span></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const errorEl=document.querySelector('#error');window.addEventListener('error',e=>{errorEl.style.display='block';errorEl.textContent='Erreur : '+e.message});
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=false;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x92c9f3);scene.fog=new THREE.Fog(0x92c9f3,190,700);scene.add(new THREE.HemisphereLight(0xffffff,0x65835b,2.1));const sun=new THREE.DirectionalLight(0xfff0cf,2.0);sun.position.set(-70,130,-130);scene.add(sun);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.2,1100);const GRADE=.045, roadY=z=>-GRADE*z, pitch=Math.atan(GRADE), laneX=[-4.35,4.35];
const mat=(c)=>new THREE.MeshLambertMaterial({color:c});const asphalt=mat(0x555b61),grass=mat(0x6cb95a),white=mat(0xf2f1e5),metal=mat(0xc1c9cc),trunk=mat(0x78543b),leaf=[mat(0x2d8e3f),mat(0x45a54a),mat(0x2d7e3b)];
function box(parent,w,h,l,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,l),m);o.position.set(x,y,z);parent.add(o);return o}
function terrainChunk(z){const g=new THREE.Group();g.position.set(0,roadY(z),z);g.rotation.x=pitch;scene.add(g);box(g,550,.13,100,grass,0,-.20,0);box(g,18.8,.18,100,asphalt,0,0,0);box(g,.18,.035,100,white,-9.15,.115,0);box(g,.18,.035,100,white,9.15,.115,0);for(let k=-45;k<50;k+=12)box(g,.17,.035,5,white,0,.115,k);
 for(const side of [-1,1]){box(g,.14,.55,100,metal,side*11,.65,0);for(let k=-44;k<50;k+=10)box(g,.12,.9,.12,metal,side*11,.25,k);}
 return g}
for(let z=300;z>=-3100;z-=100)terrainChunk(z);
// Trees are fixed to the world: the camera and vehicles travel past them.
let seed=19;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const treeGeo=new THREE.ConeGeometry(3.3,10,6),trunkGeo=new THREE.CylinderGeometry(.45,.6,3,6);for(let z=230;z>=-2900;z-=22){for(const side of [-1,1]){if(rand()<.20)continue;const x=side*(18+rand()*45), zz=z+(rand()-.5)*12, scale=.75+rand()*.9;const t=new THREE.Group();t.position.set(x,roadY(zz),zz);const b=new THREE.Mesh(trunkGeo,trunk);b.position.y=1.5*scale;b.scale.setScalar(scale);t.add(b);const crown=new THREE.Mesh(treeGeo,leaf[Math.floor(rand()*leaf.length)]);crown.position.y=7.5*scale;crown.scale.setScalar(scale);t.add(crown);scene.add(t)}}
function wheels(group,zs,halfWidth,radius){const rubber=mat(0x20272c),rim=mat(0x9da7b0);for(const z of zs)for(const side of [-1,1]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,.32,12),rubber);wheel.rotation.z=Math.PI/2;wheel.position.set(side*halfWidth,radius,z);group.add(wheel);const hub=new THREE.Mesh(new THREE.CylinderGeometry(radius*.48,radius*.48,.34,12),rim);hub.rotation.z=Math.PI/2;hub.position.copy(wheel.position);group.add(hub)}}
function truck(color,trailColor){const root=new THREE.Group();scene.add(root);const body=new THREE.Group();root.add(body);body.rotation.x=pitch;const chassis=mat(0x333b42);box(body,2.45,.4,14.6,chassis,0,1.15,0);box(body,2.45,3.45,10.6,mat(trailColor),0,3.05,2.25);box(body,2.45,3.0,3.2,mat(color),0,2.65,-5.05);box(body,2.1,1.05,.06,mat(0x93c3dc),0,3.2,-6.68);box(body,2.45,.22,.28,metal,0,1.3,-6.78);wheels(body,[-5.7,-3.7,3.8,5.7],1.23,.58);return root}
function car(color){const root=new THREE.Group();scene.add(root);const body=new THREE.Group();root.add(body);body.rotation.x=pitch;box(body,1.95,.65,4.45,mat(color),0,.95,0);box(body,1.68,.78,2.35,mat(color),0,1.55,.15);box(body,1.48,.07,.65,mat(0x9ed2e7),0,1.55,-1.07);box(body,1.48,.07,.65,mat(0x9ed2e7),0,1.55,1.37);wheels(body,[-1.45,1.45],1.03,.45);return root}
const a=truck(0xe5e6e7,0xe2e6e9),b=truck(0x356ab2,0xd5d9e0),player=car(0xe5a530),other=car(0xc5423d);
const smooth=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
const travel=(v,t)=>v*t/3.6;
// Positions are actual travelled distances (metres), not animations of a stationary road.
function state(t){const zA=-65-travel(70,t),zB=-20-travel(85,t);const v0=95/3.6,v1=85/3.6;
 let carDist;if(t<=5)carDist=v0*t+(v1-v0)*t*t/10;else if(t<=34)carDist=(v0+v1)*2.5+v1*(t-5);else{const d=t-34;carDist=(v0+v1)*2.5+v1*29+v1*d+.5*(35/3.6/14)*d*d}
 const zP=15-carDist;const zO=-128-travel(80,t);
 // Lane change only after the passing truck has enough forward clearance.
 const bx=laneX[1]+(laneX[0]-laneX[1])*smooth((t-1)/4)+(laneX[1]-laneX[0])*smooth((t-28)/6);
 return {zA,zB,zP,zO,bx,vCar:t<5?95-2*t:t<34?85:85+35*Math.min((t-34)/14,1)} }
let playing=false,t=0,last=0,collision=false;const play=document.querySelector('#play'),slider=document.querySelector('#progress'),timer=document.querySelector('#time'),status=document.querySelector('#status');
play.onclick=()=>{if(t>=50)t=0;playing=!playing;play.textContent=playing?'Ⅱ Pause':'▶ Lancer';last=performance.now()};slider.oninput=()=>{t=+slider.value;playing=false;play.textContent='▶ Reprendre';renderState(t)};
function renderState(tt){const s=state(Math.min(tt,48));a.position.set(laneX[1],roadY(s.zA)+.16,s.zA);b.position.set(s.bx,roadY(s.zB)+.16,s.zB);player.position.set(laneX[0],roadY(s.zP)+.16,s.zP);other.position.set(laneX[0],roadY(s.zO)+.16,s.zO);
 // Smooth camera transition from overtaking truck to the car (no hard cut).
 const follow=smooth((tt-25)/12);const focusZ=s.zB*(1-follow)+s.zP*follow;const focusX=s.bx*(1-follow)+laneX[0]*follow;
 const target=new THREE.Vector3(focusX*.45,roadY(focusZ)+28,focusZ+45);camera.position.copy(target);camera.lookAt(focusX*.5,roadY(focusZ-85)+1,focusZ-85);
 if(tt>=48){ // Impact is represented by a hard stop, no teleporting cars.
   const stop=state(48);const zImpact=stop.zO+4.45;player.position.z=zImpact;player.position.y=roadY(player.position.z)+.16;
 }
 timer.textContent=`00:${String(Math.floor(tt)).padStart(2,'0')} / 00:50`;slider.value=tt;
 status.textContent=tt<5?'Le camion déboîte devant la voiture':tt<28?'Dépassement lent en montée':tt<34?'Le camion se rabat':tt<48?'La voiture accélère': 'Collision — arrêt';
 renderer.render(scene,camera)}
function tick(now){if(playing){const dt=Math.min((now-last)/1000,.08);t=Math.min(50,t+dt);if(t>=50){playing=false;play.textContent='↻ Rejouer'}}last=now;renderState(t);requestAnimationFrame(tick)}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderState(0);requestAnimationFrame(tick);
</script></body></html>
