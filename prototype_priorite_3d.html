<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Studio Code Route — Prototype 01</title><style>*{box-sizing:border-box}body{margin:0;background:#dbe9ed;color:#17333b;font-family:system-ui,-apple-system,sans-serif}#stage{height:100dvh;width:100vw;position:relative;overflow:hidden}canvas{display:block}header{position:absolute;top:env(safe-area-inset-top,12px);left:14px;right:14px;display:flex;justify-content:space-between;align-items:start;pointer-events:none}h1{font-size:17px;margin:12px 0 3px;font-weight:800}small{font-size:11px;color:#49636b}.pill{background:#fffde8;border-radius:22px;padding:8px 12px;font-size:11px;font-weight:800;margin-top:12px;box-shadow:0 4px 15px #29434a20}footer{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:12px;right:12px;background:#ffffffed;border-radius:20px;padding:13px;box-shadow:0 10px 30px #26414b25;backdrop-filter:blur(12px)}#status{text-align:center;font-weight:700;font-size:14px;margin:0 0 10px}.actions{display:flex;gap:8px}button{border:0;border-radius:13px;background:#176d73;color:white;font-size:14px;font-weight:750;padding:14px 8px;flex:1}button.secondary{background:#e4edef;color:#23464c}#hint{text-align:center;color:#587178;font-size:11px;margin-top:9px}#error{position:absolute;top:30%;left:20px;right:20px;text-align:center;color:#9b2c2c;background:#fff;padding:16px;border-radius:14px;display:none}</style></head><body><div id="stage"><header><div><h1>🚙 Studio Code Route</h1><small>Prototype 01 · Intersection résidentielle</small></div><span class="pill">3D INTERACTIVE</span></header><div id="error">La 3D n'a pas pu se charger. Vérifie ta connexion Internet et réessaie.</div><footer><div id="status">Prêt : qui doit passer en premier ?</div><div class="actions"><button id="play">▶ Lancer la scène</button><button class="secondary" id="reset">↺ Recommencer</button></div><div id="hint">Glisse pour tourner la vue · Pince pour zoomer</div></footer></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const stage=document.getElementById('stage'),scene=new THREE.Scene();scene.background=new THREE.Color('#b9d8e5');scene.fog=new THREE.Fog('#b9d8e5',38,85);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,200);let az=.65,el=.84,dist=34;const look=new THREE.Vector3(0,0,0);function placeCamera(){camera.position.set(Math.sin(az)*Math.cos(el)*dist,Math.sin(el)*dist,Math.cos(az)*Math.cos(el)*dist);camera.lookAt(look)}placeCamera();const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;stage.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x77937b,2.5));const sun=new THREE.DirectionalLight(0xfff7df,3);sun.position.set(-12,24,15);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-30;sun.shadow.camera.right=30;sun.shadow.camera.top=30;sun.shadow.camera.bottom=-30;scene.add(sun);
const mat=(c,roughness=1)=>new THREE.MeshStandardMaterial({color:c,roughness});const grass=mat('#91bf81'),asphalt=mat('#777e82'),sidewalk=mat('#d9d5c9'),white=mat('#f9f7e7'),roof=mat('#bc6658'),wood=mat('#b88e6b');function box(w,h,d,m,x,y,z,parent=scene){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function cyl(r1,r2,h,m,x,y,z,parent=scene){let o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,9),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}box(65,.18,65,grass,0,-.25,0);box(65,.035,8.3,asphalt,0,.01,0);box(8.3,.035,65,asphalt,0,.02,0);for(let x=-29;x<30;x+=5){if(Math.abs(x)>6)box(2.4,.04,.12,white,x,.055,0)}for(let z=-29;z<30;z+=5){if(Math.abs(z)>6)box(.12,.04,2.4,white,0,.06,z)}for(let sx of [-1,1])for(let sz of [-1,1]){box(8,.16,8,sidewalk,sx*8.4,.01,sz*8.4);for(let i=0;i<4;i++){box(.32,.04,.7,white,sx*(4.7+i*.72),.06,sz*3.8);box(.7,.04,.32,white,sx*3.8,.06,sz*(4.7+i*.72))}}
function house(x,z,c){let group=new THREE.Group();group.position.set(x,0,z);scene.add(group);box(5,3.4,4.2,mat(c),0,1.8,0,group);const r=box(5.7,.55,4.9,roof,0,3.8,0,group);r.rotation.z=.10;box(1.1,1.8,.08,mat('#805947'),0,.95,2.15,group);for(let dx of [-1.5,1.5])box(.9,.9,.1,mat('#8cc7d5'),dx,2.3,2.15,group);return group}house(-13,-13,'#f2e6c9');house(13,-13,'#f6d7bc');house(-13,13,'#e3d8c7');house(13,13,'#e8eadf');function tree(x,z,s=1){cyl(.16*s,.22*s,2*s,wood,x,1*s,z);const green=mat(['#5e9c64','#7caa64','#61965c'][Math.abs(Math.floor(x+z))%3]);for(let p of [[0,2.65,0],[-.6,2.3,0],[.5,2.4,.3]]){let o=new THREE.Mesh(new THREE.IcosahedronGeometry(1.25*s,1),green);o.position.set(x+p[0]*s,p[1]*s,z+p[2]*s);o.castShadow=true;scene.add(o)}}for(let p of [[-20,-8],[-8,-19],[19,8],[8,19],[-19,16],[19,-18],[-21,-20],[22,21]])tree(...p,.85);
function car(color){let g=new THREE.Group();let body=mat(color,.55);box(1.85,.58,3.4,body,0,.63,0,g);box(1.65,.67,1.85,body,0,1.17,-.16,g);box(1.38,.43,.04,mat('#a3d9e5',.24),0,1.18,.79,g).rotation.x=-.18;box(1.38,.43,.04,mat('#a3d9e5',.24),0,1.18,-1.08,g).rotation.x=.18;for(let x of [-.91,.91])for(let z of [-1.07,1.07]){let wheel=new THREE.Mesh(new THREE.CylinderGeometry(.37,.37,.18,16),mat('#292e35'));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.38,z);g.add(wheel)}for(let x of [-.57,.57]){box(.3,.17,.05,mat('#fff4c8'),x,.67,1.73,g);box(.3,.17,.05,mat('#d94d4c'),x,.67,-1.73,g)}scene.add(g);return g}let blue=car('#3e8bc5'),red=car('#d65d50');blue.rotation.y=0;red.rotation.y=-Math.PI/2;let progress=0,playing=false,done=false;function updateCars(){let p=progress;blue.position.set(0,0,-13+Math.min(p,1)*8.2+(Math.max(0,p-2)*7));red.position.set(13-Math.min(Math.max(0,p-.15),1.6)*9,0,0);if(p>1.75&&p<2.1){blue.position.z=-4.8}if(p>=2.1)blue.position.z=-4.8+Math.min(p-2.1,1)*9;red.position.x=13-Math.min(Math.max(0,p-.15),2.5)*9}updateCars();let last=performance.now();function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-last)/1000,.05);last=now;if(playing){progress+=dt*.52;if(progress>=3.1){progress=3.1;playing=false;done=true;document.getElementById('status').textContent='✓ La voiture rouge passe d’abord : priorité à droite.'}else if(progress>1.1&&progress<1.7)document.getElementById('status').textContent='La bleue attend, la rouge est à sa droite.';else if(progress>=1.7)document.getElementById('status').textContent='La rouge passe, puis la bleue.';updateCars()}renderer.render(scene,camera)}requestAnimationFrame(animate);document.getElementById('play').onclick=()=>{if(done){progress=0;done=false;updateCars()}playing=!playing;document.getElementById('play').textContent=playing?'Ⅱ Pause':'▶ Reprendre';if(playing)document.getElementById('status').textContent='Observe les véhicules…'};document.getElementById('reset').onclick=()=>{progress=0;playing=false;done=false;updateCars();document.getElementById('status').textContent='Prêt : qui doit passer en premier ?';document.getElementById('play').textContent='▶ Lancer la scène'};let touch=null,pinch=null;renderer.domElement.addEventListener('pointerdown',e=>{touch={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!touch)return;az-=(e.clientX-touch.x)*.006;el=Math.max(.32,Math.min(1.35,el+(e.clientY-touch.y)*.005));touch={x:e.clientX,y:e.clientY};placeCamera()});renderer.domElement.addEventListener('pointerup',()=>touch=null);renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(17,Math.min(58,dist+e.deltaY*.02));placeCamera()},{passive:true});renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)dist=Math.max(17,Math.min(58,dist*pinch/d));pinch=d;placeCamera()}else pinch=null},{passive:true});renderer.domElement.addEventListener('touchend',()=>pinch=null);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})
</script></body></html>
