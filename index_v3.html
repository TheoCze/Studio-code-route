const host=document.getElementById('view'),scene=new T.Scene();scene.background=new T.Color(0xc0dded);scene.fog=new T.Fog(0xc0dded,70,140);const camera=new T.PerspectiveCamera(36,innerWidth/innerHeight,.1,200);camera.position.set(19,19,24);const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.6;host.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.maxPolarAngle=1.38;controls.minPolarAngle=.4;controls.minDistance=13;controls.maxDistance=57;controls.target.set(0,0,0);
scene.add(new T.HemisphereLight(0xffffff,0x8da58b,2.2));const sun=new T.DirectionalLight(0xfff1d8,3.1);sun.position.set(-18,35,19);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-38;sun.shadow.camera.right=38;sun.shadow.camera.top=38;sun.shadow.camera.bottom=-38;sun.shadow.bias=-.0003;scene.add(sun);

function mesh(geo,m,x=0,y=0,z=0,parent=scene){const o=new T.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function box(w,h,d,m,x,y,z,p=scene){return mesh(new T.BoxGeometry(w,h,d),m,x,y,z,p)}function sphere(r,m,x,y,z,p=scene){return mesh(new T.SphereGeometry(r,10,8),m,x,y,z,p)}function cylinder(a,b,h,m,x,y,z,p=scene){return mesh(new T.CylinderGeometry(a,b,h,9),m,x,y,z,p)}

for(let i=0;i<20;i++){let xx=-2.7+(i%10)*.59,zz=-1.9+Math.floor(i/10)*3.8;let r=box(.5,.04,.08,mat(i%3?'#cc7652':'#d68a62'),xx,3.31+Math.sin((i%10)/9*Math.PI)*1.7,zz,g);r.rotation.z=(i%10<5?-.45:.45);detailObjects.push(r)}return g}
function tree(x,z,scale=1){const g=new T.Group();g.position.set(x,0,z);g.scale.setScalar(scale);scene.add(g);cylinder(.18,.27,2.5,mat('#76543a'),0,1.25,0,g);for(let [xx,yy,zz,rr,cc] of [[0,3.1,0,1.25,'#3b873f'],[-.85,2.8,.25,.9,'#4c9947'],[.8,3,.15,.95,'#3b8744'],[-.25,3.65,-.45,.9,'#68a94d'],[.3,3.7,.6,.85,'#4e9743']]){let leaf=sphere(rr,mat(cc),xx,yy,zz,g);leaf.scale.set(1.1,.88,1)}for(let i=0;i<9;i++){const a=i*2.4;let s=sphere(.11,mat(i%2?'#b8d26c':'#8bc366'),Math.cos(a)*.8,3.5+Math.sin(a)*.65,Math.sin(a)*.8,g);detailObjects.push(s)}}
function bushes(x,z,count=8,axis='x'){for(let i=0;i<count;i++){let xx=x+(axis==='x'?(i-(count-1)/2)*.65:0),zz=z+(axis==='z'?(i-(count-1)/2)*.65:0);let s=sphere(.44,hedge,xx,.35,zz);s.scale.set(1,.72,.9)}}
